[package]
name = "microrustsim-tauri"
version = "0.2.1"
description = "MicroRustSim - High performance MCU and circuit simulator"
edition = "2021"

[lib]
name = "microrustsim_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sim_core = { path = "../crates/sim_core" }
sim_compiler = { path = "../crates/sim_compiler" }
sim_storage = { path = "../crates/sim_storage" }
parking_lot = "0.12"
rfd = "0.15"
