<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroRustSim - Embedded MCU Simulator</title>
    <style>
      html, body {
        background-color: #09090b !important;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: #09090b;
      }
      /* Pure CSS instant loading screen before JS mounts to guarantee 0 white flash */
      .app-preloader {
        position: fixed;
        inset: 0;
        background-color: #09090b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        user-select: none;
      }
      .app-preloader-card {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .app-preloader-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        animation: preloader-pulse 1.8s ease-in-out infinite;
      }
      .app-preloader-bar {
        width: 110px;
        height: 2px;
        background-color: #222226;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 20px;
      }
      .app-preloader-fill {
        width: 100%;
        height: 100%;
        background: #f4f4f5;
        border-radius: 9999px;
        animation: preloader-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 0.8; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes preloader-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#f4f4f5] overflow-hidden select-none m-0 p-0 h-screen w-screen">
    <div id="root" class="h-full w-full">
      <div class="app-preloader">
        <div class="app-preloader-card">
          <img src="/logo.png" alt="MicroRustSim" class="app-preloader-logo" />
          <div class="app-preloader-bar">
            <div class="app-preloader-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
