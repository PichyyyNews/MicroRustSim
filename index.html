<!doctype html>
<html lang="en" class="dark" style="background-color: #09090b; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroRustSim - Embedded MCU Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        background-color: #09090b;
      }
      html, body {
        background-color: #09090b !important;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        height: 100%;
        width: 100%;
        background-color: #09090b;
      }
      /* Pure CSS instant loading screen before React mounts to eliminate any white flash */
      .app-preloader {
        position: fixed;
        inset: 0;
        background-color: #09090b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        user-select: none;
      }
      .app-preloader-box {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .app-preloader-badge {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background-color: #141416;
        border: 1px solid #222226;
        padding: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }
      .app-preloader-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: preloader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .app-preloader-title {
        font-size: 14px;
        font-weight: 600;
        color: #f4f4f5;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      .app-preloader-subtitle {
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #71717a;
        margin-bottom: 20px;
      }
      .app-preloader-bar {
        width: 110px;
        height: 2px;
        background-color: #222226;
        border-radius: 9999px;
        overflow: hidden;
      }
      .app-preloader-fill {
        width: 100%;
        height: 100%;
        background: #f4f4f5;
        border-radius: 9999px;
        animation: preloader-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 0.8; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes preloader-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#f4f4f5] overflow-hidden select-none m-0 p-0 h-screen w-screen" style="background-color: #09090b;">
    <div id="root" class="h-full w-full">
      <div class="app-preloader">
        <div class="app-preloader-box">
          <div class="app-preloader-badge">
            <img src="/logo.png" alt="MicroRustSim" class="app-preloader-logo" />
          </div>
          <div class="app-preloader-title">MicroRustSim</div>
          <div class="app-preloader-subtitle">Cycle-Accurate ATmega328P Simulator</div>
          <div class="app-preloader-bar">
            <div class="app-preloader-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
